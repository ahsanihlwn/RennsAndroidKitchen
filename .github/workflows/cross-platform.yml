# SPDX-License-Identifier: MPL-2.0
name: Cross-Platform Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-crates:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test rak_blur
        run: cargo test --manifest-path native/rak_blur/Cargo.toml
      - name: Check termcore
        run: cargo check --manifest-path core/terminal/core/Cargo.toml
      - name: Test core filesystem & image crates
        run: |
          cargo test --manifest-path core/erofs_rs/Cargo.toml --lib
          cargo test --manifest-path core/ext_cli/Cargo.toml --lib
          cargo test --manifest-path core/make_ext4fs/Cargo.toml --lib
          cargo test --manifest-path core/magiskboot/Cargo.toml --lib
          cargo test --manifest-path core/lpunpack/Cargo.toml --lib
          cargo test --manifest-path core/sdatimg/Cargo.toml --lib
          cargo test --manifest-path core/brotli_rs/Cargo.toml --lib
          cargo test --manifest-path core/pac_extractor/Cargo.toml --lib
          cargo check --manifest-path core/platform_tools_rs/Cargo.toml

  python-compat:
    name: Python & Native Extensions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1
      - name: Install Python test & build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest psutil PySide6==6.10.1 shiboken6==6.10.1 maturin==1.15.0
      - name: Build rak_native, termcore, and rak_blur
        run: |
          python tools/build_native.py
          python tools/build_termcore.py
          python tools/build_gpu_blur.py
      - name: Run cross-platform unit tests
        run: |
          python -m pytest tests/test_cross_platform.py tests/test_disk_monitor.py tests/test_project_config.py -v
