<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAK Terminal</title>
    <link rel="stylesheet" href="xterm.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121417;
        }
        body {
            padding: 4px 6px;
        }
        #terminal-container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: relative;
        }
        /* Custom scrollbar matching RAK theme */
        .xterm .xterm-viewport::-webkit-scrollbar {
            width: 8px;
        }
        .xterm .xterm-viewport::-webkit-scrollbar-track {
            background: transparent;
        }
        .xterm .xterm-viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.28);
        }
    </style>
    <script src="qwebchannel.js"></script>
    <script src="xterm.js"></script>
    <script src="xterm-addon-fit.js"></script>
    <script src="xterm-addon-web-links.js"></script>
</head>
<body>
    <div id="terminal-container"></div>
    <script>
        let term = null;
        let fitAddon = null;
        let bridge = null;
        let requestFitTimer = null;
        let requestFitFrame = null;
        let displayRenderSubscription = null;

        function fitTerminal() {
            const container = document.getElementById('terminal-container');
            if (!term || !fitAddon || !container || !container.getClientRects().length ||
                    container.clientWidth < 20 || container.clientHeight < 20) return;
            // FitAddon measures its parent's content box; padding belongs outside it.
            fitAddon.fit();
        }

        window.requestFit = function() {
            clearTimeout(requestFitTimer);
            if (requestFitFrame) cancelAnimationFrame(requestFitFrame);
            // QML geometry, ResizeObserver and browser resize share one settle pass.
            requestFitTimer = setTimeout(() => {
                requestFitFrame = requestAnimationFrame(() => {
                    requestFitFrame = null;
                    fitTerminal();
                });
            }, 40);
        };

        window.prepareTerminalDisplay = function(request) {
            document.fonts.ready.then(() => {
                if (!term || !bridge) return;
                clearTimeout(requestFitTimer);
                if (requestFitFrame) cancelAnimationFrame(requestFitFrame);
                fitTerminal();
                if (displayRenderSubscription) displayRenderSubscription.dispose();
                displayRenderSubscription = term.onRender(() => {
                    displayRenderSubscription.dispose();
                    displayRenderSubscription = null;
                    // Let the completed canvas reach Chromium's compositor before
                    // the native pane exposes its first frame.
                    requestAnimationFrame(() => bridge.onTerminalRendered(request));
                });
                term.write('', () => term.refresh(0, term.rows - 1));
            });
        };

        function initTerminal() {
            term = new Terminal({
                cursorBlink: true,
                cursorStyle: 'bar',
                fontFamily: "'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace",
                fontSize: 15,
                lineHeight: 1.3,
                scrollback: 10000,
                windowsMode: true,
                convertEol: true,
                theme: {
                    background: '#121417',
                    foreground: '#e2e8f0',
                    cursor: '#38bdf8',
                    cursorAccent: '#121417',
                    selectionBackground: 'rgba(56, 189, 248, 0.35)',
                    black: '#1e293b',
                    red: '#ef4444',
                    green: '#22c55e',
                    yellow: '#eab308',
                    blue: '#3b82f6',
                    magenta: '#a855f7',
                    cyan: '#06b6d4',
                    white: '#f8fafc',
                    brightBlack: '#475569',
                    brightRed: '#f87171',
                    brightGreen: '#4ade80',
                    brightYellow: '#fde047',
                    brightBlue: '#60a5fa',
                    brightMagenta: '#c084fc',
                    brightCyan: '#22d3ee',
                    brightWhite: '#ffffff'
                }
            });

            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);

            window.term = term;
            window.fitAddon = fitAddon;

            if (window.WebLinksAddon) {
                term.loadAddon(new WebLinksAddon.WebLinksAddon());
            }

            const container = document.getElementById('terminal-container');
            term.open(container);

            // The native host focuses the selected pane when it becomes visible.
            const resizeObserver = new ResizeObserver(() => window.requestFit());
            resizeObserver.observe(container);
            document.fonts.ready.then(() => window.requestFit());
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) window.requestFit();
            });

            window.addEventListener('resize', () => {
                window.requestFit();
            });

            // Prevent browser from navigating on dropped files
            window.addEventListener('dragover', event => {
                event.preventDefault();
                if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
            });
            window.addEventListener('drop', event => {
                event.preventDefault();
            });

            term.attachCustomKeyEventHandler(event => {
                if (event.type === 'keydown') {
                    if (event.ctrlKey && event.key === 'c' && term.hasSelection()) {
                        document.execCommand('copy');
                        return false;
                    }
                    if (event.ctrlKey && event.key === 'v') {
                        return true;
                    }
                }
                return true;
            });

            // Zooming support with Ctrl + MouseWheel
            window.addEventListener('wheel', event => {
                if (event.ctrlKey) {
                    event.preventDefault();
                    let current = term.options.fontSize || 15;
                    if (event.deltaY < 0) {
                        term.options.fontSize = Math.min(32, current + 1);
                    } else {
                        term.options.fontSize = Math.max(10, current - 1);
                    }
                    window.requestFit();
                }
            }, { passive: false });

            // Keyboard shortcut zooming (Ctrl+=, Ctrl+-, Ctrl+0)
            window.addEventListener('keydown', event => {
                if (event.ctrlKey) {
                    if (event.key === '=' || event.key === '+') {
                        event.preventDefault();
                        term.options.fontSize = Math.min(32, (term.options.fontSize || 15) + 1);
                        window.requestFit();
                    } else if (event.key === '-' || event.key === '_') {
                        event.preventDefault();
                        term.options.fontSize = Math.max(10, (term.options.fontSize || 15) - 1);
                        window.requestFit();
                    } else if (event.key === '0') {
                        event.preventDefault();
                        term.options.fontSize = 15;
                        window.requestFit();
                    }
                }
            });

            container.addEventListener('click', () => {
                term.focus();
            });

            if (typeof qt !== 'undefined' && qt.webChannelTransport) {
                new QWebChannel(qt.webChannelTransport, channel => {
                    bridge = channel.objects.bridge;
                    window.bridge = bridge;
                    term.options.windowsPty = bridge.ptyOptions || {};

                    term.onData(data => {
                        bridge.sendInput(data);
                    });

                    term.onResize(size => {
                        bridge.resizePty(size.cols, size.rows);
                    });

                    bridge.outputReceived.connect(chunk => {
                        term.write(chunk);
                    });

                    bridge.themeChanged.connect(themeJson => {
                        try {
                            const th = JSON.parse(themeJson);
                            if (th.theme) {
                                term.options.theme = th.theme;
                            }
                            if (th.fontFamily) {
                                term.options.fontFamily = th.fontFamily;
                            }
                            if (th.fontSize) {
                                term.options.fontSize = th.fontSize;
                            }
                            if (th.bg) {
                                document.body.style.backgroundColor = th.bg;
                            }
                            window.requestFit();
                        } catch (err) {
                            console.error('Failed to parse theme JSON', err);
                        }
                    });

                    bridge.clearRequested.connect(() => {
                        term.clear();
                    });

                    // A hidden Qt Quick pane can pause requestAnimationFrame.
                    // The channel is ready now; do not hold buffered PTY output
                    // or startup commands until the pane receives a frame.
                    fitTerminal();
                    bridge.onTerminalReady(term.cols, term.rows);
                    window.requestFit();
                });
            }
        }

        window.addEventListener('DOMContentLoaded', initTerminal);
    </script>
</body>
</html>
