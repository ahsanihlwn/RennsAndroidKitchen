- module-name: 'core'
  dlls:
    - from_filenames:
        relative_path: 'native'
        prefixes:
          - 'rak_blur'
        suffixes:
          - 'dll'
      dest_path: 'core/native'
      when: 'win32'
    - from_filenames:
        relative_path: 'native'
        prefixes:
          - 'librak_blur'
        suffixes:
          - 'so'
      dest_path: 'core/native'
      when: 'linux'
    - from_filenames:
        relative_path: 'native'
        prefixes:
          - 'librak_blur'
        suffixes:
          - 'dylib'
      dest_path: 'core/native'
      when: 'macos'
