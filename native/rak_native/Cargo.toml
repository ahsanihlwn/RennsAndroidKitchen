[package]
name = "rak-native"
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
description = "Read-only filesystem scanning and Android metadata parsing for RAK"

[lib]
name = "rak_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.28.2", features = ["abi3-py310"] }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
