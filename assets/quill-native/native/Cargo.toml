[package]
name = "quill-native-engine"
version = "0.3.0"
edition = "2021"
license = "MIT"

[lib]
name = "_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.27.2", features = ["abi3-py310"] }
floem-editor-core = { version = "=0.2.0", default-features = false }
tempfile = "=3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
